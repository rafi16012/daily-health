name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DailyHealth.apk
          cp prayer/build/outputs/apk/debug/prayer-debug.apk SalahTracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            DailyHealth.apk
            SalahTracker.apk

      - name: Publish download link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DailyHealth.apk SalahTracker.apk --title "My apps" --notes "Open this page on your Android phone and tap an APK to install it."
