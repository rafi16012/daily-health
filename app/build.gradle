plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arrafi.dailyhealth'
    compileSdk 34

    defaultConfig {
        applicationId 'com.arrafi.dailyhealth'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        shared {
            storeFile rootProject.file('signing.keystore')
            storePassword 'dailyapps'
            keyAlias 'apps'
            keyPassword 'dailyapps'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
